name: Source-only checks
on: [push, pull_request]
jobs:
  source-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_public.py --require-index
      - run: python scripts/package_source.py --output reports/source-release.zip
      # No firmware, runtime logs, frames or data disk artifacts are uploaded.
